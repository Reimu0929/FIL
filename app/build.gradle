plugins { id 'com.android.application' }

android {
    namespace 'com.example.photostand'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.photostand'
        minSdk 21
        targetSdk 28
        versionCode 4
        versionName '1.3'
    }
    signingConfigs {
        debug {
            // リポジトリに固定したデバッグ鍵。GitHub Actions でも同じ署名になる。
            storeFile file('../debug.keystore')
            storeType 'PKCS12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
