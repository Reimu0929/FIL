plugins { id 'com.android.application' }

android {
    namespace 'com.example.photostand'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.photostand'
        minSdk 21
        targetSdk 28
        versionCode 4
        versionName '1.3'
    }
    signingConfigs {
        debug {
            // リポジトリに固定したデバッグ鍵。GitHub Actions でも同じ署名になる。
            storeFile file('../debug.keystore')
            storeType 'PKCS12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // debug.keystore と同じ鍵で署名するので署名は同じまま(上書きインストール可)。
            // debuggable は付かないため、配布はこちらを使う。
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        // targetSdk 28(レガシーストレージ)は現行仕様。Google Play の政策チェックのみ対象外にする。
        disable 'ExpiredTargetSdkVersion'
    }
}
